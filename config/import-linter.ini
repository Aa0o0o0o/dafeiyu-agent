[importlinter]
root_package = src
include_external_packages = False

[importlinter:contract:storage-boundary]
name = Storage must not depend on conversation or transport
type = forbidden
source_modules =
    src.storage
    src.memory_state
    src.memory_v2.service
    src.memory_v2.repository
    src.memory_v2.decay
    src.memory_v2.admission
    src.memory_v2.retrieval
    src.memory_v2.deletion
    src.memory_v2.maintenance
    src.memory_v2.graph
forbidden_modules =
    src.conversation
    src.astrbot_runtime
    src.group_chat

[importlinter:contract:contracts-boundary]
name = Contracts must not depend on implementations
type = forbidden
source_modules =
    src.contracts
forbidden_modules =
    src.storage
    src.conversation
    src.astrbot_runtime
    src.group_chat
