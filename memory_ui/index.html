<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>大肥鱼 · 记忆图</title><link rel="stylesheet" href="/assets/style.css"><script defer src="/assets/vendor/cytoscape.min.js"></script><script defer src="/assets/app.js"></script></head>
<body><main>
<header><div><h1>大肥鱼 <span>记忆图</span></h1><p>外部记忆关联网络 · 同一权威记忆库 · 默认只读</p></div><span id="connection" role="status">尚未连接</span><button id="logout" hidden>退出</button></header>
<section id="login"><h2>本机管理登录</h2><p>双击项目里的「11_打开记忆图.cmd」查看本机登录信息。登录密钥不会进入网址。</p><form id="loginForm"><label>管理QQ<input id="viewer" autocomplete="username" value="2222222222" required></label><label>本机面板密码<input id="password" type="password" autocomplete="current-password" required></label><button>登录记忆图</button><p id="loginError" role="alert"></p></form></section>
<section id="workspace" hidden>
<details><summary>语音面板 · 本地试听</summary><button id="voiceStatus">刷新语音状态</button><p id="voiceState">自动语音关闭；模型和音色需通过验收。</p><label>试听文字<input id="voiceText" maxlength="200" value="我在呀，你慢慢说，鱼听着呢。"></label><button id="voicePreview">生成本地试听（不发QQ）</button><audio id="voiceAudio" controls></audio></details>
<nav aria-label="记忆筛选"><label>范围<select id="scope"></select></label><label>搜索<input id="search" placeholder="查找真实记忆"></label><label>层<select id="layer"><option value="">所有层</option><option>M0</option><option>M1</option><option>M2</option><option>M3</option><option>M4</option><option>M5</option></select></label><label>状态<select id="status"><option value="">所有状态</option><option>active</option><option>dormant</option><option>frozen</option><option>candidate</option><option>superseded</option><option>disputed</option></select></label><label>主体QQ<input id="subject" inputmode="numeric" placeholder="可选"></label></nav>
<div class="toolbar"><button id="fit">适配视野</button><button id="relayout">重新布局</button><button id="save">保存布局</button><button id="lock">固定/释放选中节点</button><button id="listToggle">列表视图</button><label>最近召回<select id="trace"><option value="">没有召回轨迹</option></select></label><button id="more" hidden>加载下一页</button></div>
<div class="canvasRow"><div class="graphWrap"><div id="graph" aria-label="可拖动的记忆关联图"></div><div id="empty" hidden>这个范围和筛选条件下还没有记忆。<br>不会用演示节点填充真实图。</div><div id="list" hidden role="list" aria-label="记忆列表"></div></div><aside id="details"><h2>选择一条记忆</h2><p>查看主体、来源、有效时间与真实遗忘曲线。拖动只改变布局。</p></aside></div>
<footer><label>未来投影 <input id="future" type="range" min="0" max="180" value="0"><output id="days">当前状态</output></label><p id="projectionNote">假设没有新证据；预览不改变记忆、时钟或证据。</p><p><span class="legend">M0 核心 · M1 工作 · M2 情景 · M3 语义 · M4 表达 · M5 冷存</span></p><p id="summary"></p><p id="notice" role="status"></p></footer>
</section></main></body></html>
